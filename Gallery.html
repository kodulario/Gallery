<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>minimal · 3:4 gallery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f4f6fa;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      padding: 1.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .gallery-header {
      width: 100%;
      max-width: 1200px;
      margin-bottom: 1.5rem;
    }

    .gallery-header h1 {
      font-weight: 380;
      font-size: 1.9rem;
      letter-spacing: -0.02em;
      color: #1e2b3c;
      border-bottom: 1px solid #d9e0e8;
      padding-bottom: 0.5rem;
    }

    .gallery-header p {
      color: #617388;
      font-size: 0.9rem;
      margin-top: 0.2rem;
    }

    /* ----- grid: responsive, 3:4 cells ----- */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
      width: 100%;
      max-width: 1200px;
    }

    .gallery-item {
      aspect-ratio: 3 / 4;           /* fixed 3:4 ratio */
      background: #e3e8f0;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
      transition: box-shadow 0.2s;
      cursor: pointer;
    }

    .gallery-item:hover {
      box-shadow: 0 8px 20px rgba(0, 20, 40, 0.08);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;              /* fills the 3:4 container */
      display: block;
      background: #d3dce8;
    }

    /* ----- lightbox overlay (hidden by default) ----- */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(10, 15, 24, 0.95);
      backdrop-filter: blur(8px);
      display: none;                  /* hidden until opened */
      align-items: center;
      justify-content: center;
      z-index: 1000;
      touch-action: pan-y pinch-zoom; /* allow some touch, we override */
      user-select: none;
    }

    /* image container */
    .lightbox-content {
      position: relative;
      width: 90vw;
      height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 6px 30px rgba(0,0,0,0.3);
    }

    /* navigation buttons */
    .lightbox-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(230, 240, 255, 0.15);
      border: none;
      color: white;
      font-size: 2.8rem;
      width: 4rem;
      height: 4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 60px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.1);
      line-height: 1;
      padding-bottom: 6px;
      -webkit-tap-highlight-color: transparent;
    }

    .lightbox-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .lightbox-btn:active {
      transform: translateY(-50%) scale(0.95);
    }

    .prev-btn {
      left: 1rem;
    }
    .next-btn {
      right: 1rem;
    }

    /* close button (top right) */
    .close-btn {
      position: absolute;
      top: 1.5rem;
      right: 1.8rem;
      background: none;
      border: none;
      color: #fff;
      font-size: 2.6rem;
      cursor: pointer;
      width: 3.2rem;
      height: 3.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 40px;
      background: rgba(20, 25, 35, 0.6);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.1);
      transition: 0.1s;
      line-height: 1;
      z-index: 1010;
    }

    .close-btn:hover {
      background: rgba(180, 40, 40, 0.7);
    }

    /* image index indicator */
    .image-index {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 15, 20, 0.6);
 backdrop-filter: blur(4px);
      color: #eef4ff;
      padding: 0.4rem 1.2rem;
      border-radius: 60px;
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.3px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* extra minimal footer */
    .footer-note {
      margin-top: 2rem;
      color: #7d8b9f;
      font-size: 0.8rem;
    }

    /* adjust touch area for small screens */
    @media (max-width: 600px) {
      .gallery-grid {
        gap: 0.7rem;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      }
      .lightbox-btn {
        width: 3rem;
        height: 3rem;
        font-size: 2rem;
      }
      .prev-btn { left: 0.3rem; }
      .next-btn { right: 0.3rem; }
      .close-btn {
        top: 0.8rem;
        right: 0.8rem;
        width: 2.8rem;
        height: 2.8rem;
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="gallery-header">
    <h1>∎ 3:4 gallery</h1>
    <p>tap image · swipe or arrows · no buttons, just browse</p>
  </div>

  <!-- gallery grid will be injected here via js -->
  <div class="gallery-grid" id="galleryGrid"></div>

  <!-- lightbox overlay -->
  <div class="lightbox" id="lightbox">
    <button class="close-btn" id="closeLightboxBtn" aria-label="Close">✕</button>
    <div class="lightbox-content">
      <button class="lightbox-btn prev-btn" id="prevBtn" aria-label="Previous image">‹</button>
      <img class="lightbox-image" id="lightboxImg" src="" alt="full view">
      <button class="lightbox-btn next-btn" id="nextBtn" aria-label="Next image">›</button>
    </div>
    <div class="image-index" id="imageIndex"></div>
  </div>

  <div class="footer-note">
    ⚡ JSON data embedded — edit the urls array
  </div>

  <script>
    (function() {
      // --- 📁 image URLs : this is your "JSON" data (easy to edit, add, remove) ---
      const imageUrls = [
        "https://picsum.photos/id/100/300/400",   // camera
        "https://picsum.photos/id/101/300/400",   // landscape
        "https://picsum.photos/id/102/300/400",   // berry
        "https://picsum.photos/id/103/300/400",   // lighthouse
        "https://picsum.photos/id/104/300/400",   // waterfall
        "https://picsum.photos/id/106/300/400",   // flower
        "https://picsum.photos/id/107/300/400",   // grass
        "https://picsum.photos/id/108/300/400",   // dog
        "https://picsum.photos/id/169/300/400",   // bridge (additional)
        "https://picsum.photos/id/155/300/400"    // train
      ];

      // --- DOM elements ---
      const galleryGrid = document.getElementById('galleryGrid');
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightboxImg');
      const imageIndexSpan = document.getElementById('imageIndex');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const closeBtn = document.getElementById('closeLightboxBtn');

      // --- state ---
      let currentIndex = 0;
      let isOpen = false;               // flag for keyboard / swipe

      // --- render gallery thumbnails (3:4 grid) ---
      function renderGallery() {
        galleryGrid.innerHTML = '';      // clear if any
        imageUrls.forEach((url, idx) => {
          const item = document.createElement('div');
          item.className = 'gallery-item';
          item.setAttribute('data-index', idx);
          const img = document.createElement('img');
          img.src = url;
          img.alt = `gallery image ${idx+1}`;
          img.loading = 'lazy';          // nice for performance
          item.appendChild(img);

          // open lightbox on click
          item.addEventListener('click', (e) => {
            e.stopPropagation();
            openLightbox(idx);
          });

          galleryGrid.appendChild(item);
        });
      }

      // --- open lightbox at given index ---
      function openLightbox(index) {
        if (index < 0 || index >= imageUrls.length) return;
        currentIndex = index;
        updateLightboxImage();
        lightbox.style.display = 'flex';
        isOpen = true;
        // disable body scroll
        document.body.style.overflow = 'hidden';
        // add keyboard listener
        window.addEventListener('keydown', handleKeyDown);
      }

      // --- close lightbox ---
      function closeLightbox() {
        lightbox.style.display = 'none';
        isOpen = false;
        document.body.style.overflow = '';
        window.removeEventListener('keydown', handleKeyDown);
      }

      // --- update image and index inside lightbox ---
      function updateLightboxImage() {
        if (!isOpen) return;
        lightboxImg.src = imageUrls[currentIndex];
        imageIndexSpan.textContent = `${currentIndex+1} / ${imageUrls.length}`;
      }

      // --- next / prev with wrap-around ---
      function nextImage() {
        currentIndex = (currentIndex + 1) % imageUrls.length;
        updateLightboxImage();
      }

      function prevImage() {
        currentIndex = (currentIndex - 1 + imageUrls.length) % imageUrls.length;
        updateLightboxImage();
      }

      // --- keyboard navigation ---
      function handleKeyDown(e) {
        if (!isOpen) return;
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          prevImage();
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          nextImage();
        } else if (e.key === 'Escape') {
          closeLightbox();
        }
      }

      // --- 👆 SWIPE detection (touch) ---
      let touchStartX = 0;
      let touchStartY = 0;
      const SWIPE_THRESHOLD = 50;        // minimum px for swipe

      function handleTouchStart(e) {
        if (!isOpen) return;
        const touch = e.changedTouches[0];
        touchStartX = touch.screenX;
        touchStartY = touch.screenY;
      }

      function handleTouchEnd(e) {
        if (!isOpen) return;
        const touch = e.changedTouches[0];
        const diffX = touch.screenX - touchStartX;
        const diffY = touch.screenY - touchStartY;

        // horizontal swipe stronger than vertical
        if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > SWIPE_THRESHOLD) {
          e.preventDefault();    // avoid any accidental scroll
          if (diffX > 0) {
            prevImage();          // swipe right → previous
          } else {
            nextImage();          // swipe left → next
          }
        }
      }

      // prevent touchmove while swiping on lightbox (avoid page scroll)
      function handleTouchMove(e) {
        if (isOpen) {
          // only prevent if we are interacting with lightbox (optional)
          e.preventDefault();
        }
      }

      // --- attach touch listeners to lightbox overlay ---
      lightbox.addEventListener('touchstart', handleTouchStart, { passive: true });
      lightbox.addEventListener('touchend', handleTouchEnd, { passive: false });
      lightbox.addEventListener('touchmove', handleTouchMove, { passive: false });

      // --- button listeners ---
      prevBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        prevImage();
      });

      nextBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        nextImage();
      });

      closeBtn.addEventListener('click', closeLightbox);

      // optional: click on overlay (but not on image/buttons) closes?
      // we can add that behaviour, but we keep it minimal: only close via close button.
      // if you want click outside image to close, we would need more logic.
      // we stick to the clean close button.

      // --- initialize gallery ---
      renderGallery();

      // --- (optional) simulate JSON loading: you can replace imageUrls by fetching from an external .json
      // for example: 
      // fetch('photos.json').then(res => res.json()).then(urls => { imageUrls = urls; renderGallery(); })
      // but for this demo we use the embedded array.
      console.log('gallery ready — data from inline JSON (array)');
    })();
  </script>
  <!-- note: the imageUrls array above acts as your editable JSON. 
       replace it with an external fetch if you prefer a real JSON file. -->
</body>
</html>
